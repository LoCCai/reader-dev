services:
  reader-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: reader-dev:local
    container_name: reader-dev
    restart: unless-stopped
    ports:
      - "10002:8080"
    environment:
      READER_APP_SECURE: "true"
      # 密钥已挪 .env(600 权限,不入库)——compose 自动读取同目录 .env 做变量替换
      READER_APP_SECUREKEY: ${READER_APP_SECUREKEY}
      READER_SERVER_PORT: "8080"
      READER_APP_WORKDIR: /data
      READER_APP_USERLIMIT: "100"
      READER_APP_USERBOOKLIMIT: "50000"
      TZ: Asia/Shanghai
      # 出网走宿主 clash（7890 已验证为 HTTP 代理）：解决大量书源站直连超时/DNS 污染/
      # CF 盾超时（2026-10-23 实测多数源 Network unreachable）。书源级 proxyUrl 仍优先。
      READER_HTTP_PROXY: http://host.docker.internal:7890
      # camoufox 浏览器兜底同一代理（clash 混合端口，HTTP 协议即可）
      READER_CAMOUFOX_PROXY: http://host.docker.internal:7890
      # 七七（QIQIBot）专用封装 API /bot/v1 的 Key（key:命名空间；详见 docs/BOT-API.md）
      READER_BOT_API_KEYS: ${READER_BOT_API_KEYS}
      # 封面直链的公网/内网基地址（搜索结果 coverApi 会拼成绝对 URL）
      READER_PUBLIC_URL: "http://192.168.31.193:10002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 容器内进程不可提权（缓解 camoufox/不可信书源内容链路的权限逃逸面）
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # 1g→2g：dmesg 实锤爬取高峰 3 次 OOM-kill（1.03GB 撞顶）；camoufox Firefox 亦需余量
          memory: 2g
